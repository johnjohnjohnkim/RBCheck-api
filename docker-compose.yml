# Runs RBCheck on one server: `docker compose up -d --build`.
# Settings come from .env next to this file (copy .env.example).

# Keep each container's logs to at most 30 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Same major version as the Postgres the data is moved from, so pg_dump's output restores cleanly.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?set in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set in .env}
      POSTGRES_DB: ${DATABASE_NAME:?set in .env}
      TZ: ${TIMEZONE:-America/Toronto}
    volumes:
      # Postgres 18 images keep their data under this directory.
      - pgdata:/var/lib/postgresql
    # No ports: only the api container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  api:
    build: .
    environment:
      DATABASE_HOSTNAME: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      INGEST_API_KEY: ${INGEST_API_KEY:?set in .env}
      TIMEZONE: ${TIMEZONE:-America/Toronto}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy keeps its HTTPS certificates here, so restarts don't ask for new ones.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy-data:
  caddy-config:
